<?xml version="1.0" encoding="UTF-8"?>
<!-- Nibras app icon — Concept A: Shield + neural node motif
     1024x1024 SVG (conceptA). File name chosen to avoid collisions.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Nibras App Icon — Shield with neural node motif</title>
  <desc id="desc">A modern shield with an abstract neural node network inside, representing on-device AI security scanning.</desc>
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#0ea5a4" />
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#05202a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- rounded square background to read well at small sizes -->
  <rect x="64" y="64" width="896" height="896" rx="196" ry="196" fill="url(#g1)" />

  <!-- shield motif centered -->
  <g transform="translate(512,480)">
    <!-- subtle outer shield shape with soft stroke -->
    <path d="M0 -320 C180 -320 260 -220 260 -80 C260 160 0 320 0 320 C0 320 -260 160 -260 -80 C-260 -220 -180 -320 0 -320 Z"
          fill="#07202b" opacity="0.06" transform="translate(6,10)" />

    <path d="M0 -300 C165 -300 240 -210 240 -75 C240 150 0 300 0 300 C0 300 -240 150 -240 -75 C-240 -210 -165 -300 0 -300 Z"
          fill="url(#g1)" stroke="rgba(255,255,255,0.08)" stroke-width="2" filter="url(#s)" />

    <!-- inner neural-node network -->
    <g transform="translate(0,40) scale(0.92)">
      <!-- links -->
      <line x1="-80" y1="-80" x2="0" y2="-40" stroke="rgba(255,255,255,0.18)" stroke-width="8" stroke-linecap="round" />
      <line x1="0" y1="-40" x2="100" y2="10" stroke="rgba(255,255,255,0.18)" stroke-width="8" stroke-linecap="round" />
      <line x1="-80" y1="-80" x2="-120" y2="30" stroke="rgba(255,255,255,0.14)" stroke-width="6" stroke-linecap="round" />
      <line x1="-120" y1="30" x2="40" y2="80" stroke="rgba(255,255,255,0.14)" stroke-width="6" stroke-linecap="round" />
      <line x1="40" y1="80" x2="140" y2="40" stroke="rgba(255,255,255,0.12)" stroke-width="5" stroke-linecap="round" />

      <!-- nodes -->
      <circle cx="-80" cy="-80" r="18" fill="#ffffff" opacity="0.95" />
      <circle cx="0" cy="-40" r="26" fill="#ffffff" />
      <circle cx="100" cy="10" r="14" fill="#ffffff" opacity="0.95" />
      <circle cx="-120" cy="30" r="10" fill="#ffffff" opacity="0.9" />
      <circle cx="40" cy="80" r="12" fill="#ffffff" opacity="0.9" />
      <circle cx="140" cy="40" r="8" fill="#ffffff" opacity="0.85" />

      <!-- subtle central accent (glow) -->
      <ellipse cx="0" cy="-40" rx="54" ry="24" fill="#ffffff" opacity="0.04" />
    </g>

    <!-- subtle highlight line to add depth -->
    <path d="M-180 -180 C-120 -220 0 -240 180 -180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- small white rim for legibility at tiny sizes -->
  <rect x="76" y="76" width="872" height="872" rx="188" ry="188" fill="none" stroke="rgba(255,255,255,0.03)" />

</svg>
